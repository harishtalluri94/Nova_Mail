[workspace]
resolver = "2"
members = [
    "services/lmtp-gateway",
    "services/jmap-service",
    "services/delivery-worker",
    "services/indexer",
    "services/search-gateway",
    "services/previewer",
    "services/ai-assistant",
    "services/link-service",
    "services/admin-api",
    "services/antiabuse",
    "libs/common",
    "libs/mime-tools",
    "libs/jmap-sdk-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Nova Mail Team"]
license = "Proprietary"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# Web frameworks
axum = { version = "0.7", features = ["http2", "macros"] }
hyper = { version = "1.1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }

# HTTP/3 & QUIC
quinn = "0.10"
h3 = "0.0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "uuid"] }
deadpool-postgres = "0.12"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Object storage
aws-sdk-s3 = "1.13"
aws-config = "1.1"

# Search
tantivy = "0.21"

# Email parsing & generation
mail-parser = "0.9"
mail-builder = "0.3"

# Crypto
ring = "0.17"
ed25519-dalek = "2.1"
sha2 = "0.10"
blake3 = "1.5"
argon2 = "0.5"
webauthn-rs = "0.4"

# Compression
zstd = "0.13"
brotli = "3.4"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.14"
opentelemetry-prometheus = "0.14"
metrics = "0.21"
sentry = "0.32"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.21"
bytes = "1.5"
futures = "0.3"
once_cell = "1.19"
regex = "1.10"

# AI/ML
candle-core = "0.3"
tokenizers = "0.15"

# Image processing
image = "0.24"
webp = "0.2"

# PDF processing
pdf = "0.8"

# Configuration
config = "0.13"
dotenvy = "0.15"

# Testing
mockall = "0.12"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
